<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Pedagógica n8n</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    header {
      background: #8A1538;
      color: white;
      padding: 20px;
      border-radius: 10px;
    }

    main {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
    }

    main label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #8A1538;
    }

    main input,
    main textarea,
    main select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #8A1538;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #mensajeAlerta {
      margin-top: 12px;
      font-weight: bold;
      color: #8A1538;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #8A1538;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Alerta Pedagógica con n8n</h1>

    <p>
      Esta pantalla envía una alerta ficticia a n8n mediante un Webhook.
      No uses datos reales.
    </p>
  </header>

  <main>

    <section>

      <h2>Enviar alerta ficticia</h2>

      <label for="tipoAlerta">Tipo de alerta</label>

      <select id="tipoAlerta">
        <option value="Orientación">Orientación</option>
        <option value="Convivencia">Convivencia</option>
        <option value="Protección">Protección</option>
        <option value="Seguimiento de veeduría juvenil">
          Seguimiento de veeduría juvenil
        </option>
      </select>

      <label for="descripcionAlerta">
        Descripción ficticia
      </label>

      <textarea
        id="descripcionAlerta"
        rows="4"
      >Se solicita revisión pedagógica de una observación realizada por una veeduría juvenil ficticia.</textarea>

      <label for="responsableAlerta">
        Responsable ficticio
      </label>

      <input
        id="responsableAlerta"
        type="text"
        value="Equipo académico"
      >

      <button id="btnEnviarAlerta" type="button">
        Enviar alerta a n8n
      </button>

      <p id="mensajeAlerta"></p>

    </section>

  </main>

  <script>

    const WEBHOOK_N8N = "https://celeste-v.app.n8n.cloud/webhook-test/alerta-pedagogica";

    const btnEnviarAlerta =
      document.getElementById("btnEnviarAlerta");

    const mensajeAlerta =
      document.getElementById("mensajeAlerta");

    btnEnviarAlerta.addEventListener(
      "click",
      async function () {

        const tipo =
          document.getElementById("tipoAlerta").value;

        const descripcion =
          document.getElementById("descripcionAlerta")
          .value
          .trim();

        const responsable =
          document.getElementById("responsableAlerta")
          .value
          .trim();

        const alerta = {
          tipo: tipo,
          descripcion: descripcion,
          responsable: responsable,
          origen:
            "Proyecto pedagógico Programadores para la Paz",
          fecha: new Date().toISOString()
        };

        try {

          const respuesta = await fetch(
            WEBHOOK_N8N,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify(alerta)
            }
          );

          if (respuesta.ok) {

            mensajeAlerta.textContent =
              "Alerta ficticia enviada correctamente a n8n.";

          } else {

            mensajeAlerta.textContent =
              "La alerta fue enviada, pero n8n no respondió como se esperaba.";
          }

        } catch (error) {

          mensajeAlerta.textContent =
            "No se pudo conectar con el Webhook de n8n.";

          console.error(error);
        }
      }
    );

  </script>

</body>
</html>
